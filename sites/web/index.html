<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>研论书屋</title>
    <link rel="icon" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./assets/study.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button
          id="navBtn"
          class="nav-btn"
          type="button"
          aria-label="展开研究库"
          aria-expanded="false"
          aria-controls="sidebar"
          title="展开研究库"
        >
          <span class="nav-btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <path d="M9 3v18"></path>
              <path d="m12 9 3 3-3 3"></path>
            </svg>
          </span>
          <span class="nav-btn-label">展开研究库</span>
        </button>
        <a class="brand" href="#/">研论书屋</a>
        <a class="topbar-back" id="topbarBack" href="#/" aria-label="返回项目列表" hidden>
          <span aria-hidden="true">←</span>
          <span class="topbar-back-full">返回项目列表</span>
          <span class="topbar-back-short">返回</span>
        </a>
      </div>
      <div class="save-mode-wrap">
        <button
          type="button"
          class="save-mode"
          id="saveMode"
          aria-expanded="false"
          aria-controls="saveModePop"
        >
          本机保存
        </button>
        <div class="save-mode-pop" id="saveModePop" role="note" aria-label="存储信息" hidden></div>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="研究导航">
        <div class="sidebar-heading">
          <span class="sidebar-feather-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
              <path d="m16 8-14 14"></path>
              <path d="M17.5 15H9"></path>
            </svg>
            <img class="sidebar-feather-mark-image" data-src="./assets/sidebar-feather.png" alt="" draggable="false">
          </span>
          <p class="sidebar-label">研究库</p>
        </div>
        <nav class="side-nav" id="sideNav"></nav>
        <svg class="sidebar-feather" viewBox="0 0 120 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M96 24C72 9 43 17 29 41 14 66 24 96 48 111c17 11 35 5 51-10-20 7-42-3-51-21-10-20-1-41 19-49 12-5 24-1 29-7Z"></path>
          <path d="m18 145 73-111M35 119l38-8M46 96l44-5M58 73l36-2M70 51l22 1"></path>
        </svg>
        <img class="sidebar-feather-image" data-src="./assets/sidebar-feather.png" alt="" draggable="false">
        <div
          class="sidebar-resizer"
          id="sidebarResizer"
          role="separator"
          aria-label="调整研究库宽度"
          aria-orientation="vertical"
          aria-valuemin="208"
          aria-valuemax="420"
          aria-valuenow="248"
          aria-valuetext="248 像素"
          aria-disabled="false"
          tabindex="0"
          title="拖动调整宽度；方向键微调"
        >
          <img class="sidebar-tree-image" data-src="./assets/sidebar-winding-tree.png" alt="" draggable="false">
          <img class="sidebar-leaf-source" data-src="./assets/sidebar-leaf.png" alt="" draggable="false" hidden>
        </div>
      </aside>

      <main class="content" id="main" tabindex="-1"></main>
    </div>

    <div class="sidebar-leaf-layer" id="sidebarLeafLayer" aria-hidden="true"></div>

    <script type="module" src="./assets/study.js"></script>
  </body>
</html>
